<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">


    <title>To-Do App</title>
</head>
<body>
   


    <div class="d-flex">
        <nav class="sidebar d-flex flex-column flex-shrink-0 position-fixed">
            <button class="toggle-btn" onclick="toggleSidebar()">
                <i class="fas fa-chevron-left"></i>
            </button>

            <div class="p-4">
                <h4 class="logo-text fw-bold mb-0">TO-DO</h4>
                <p class="text-muted small hide-on-collapse">Smart Lists</p>
            </div>

            <div class="nav flex-column">
                <a href="#" class="sidebar-link active text-decoration-none p-3 d-flex align-items-center">
                    <i class="fas fa-home me-3"></i>
                    <span class="hide-on-collapse">Dashboard</span>
                </a>
            </div>
        </nav>

       <main class="main-content w-100">
            <div class="all-to-do-container" id="allToDoContainer">
                <!-- Pass 'this' into delTask(this) so it knows which item to delete -->
                <div class="to-do-holder d-flex flex-column">
                    <div class="to-do-container d-flex align-items-center gap-4 py-lg-2" onclick="delTask(this)">
                        <button type="button" class="rounded-circle text-center d-flex align-items-center justify-content-center" style="width: 20px; height: 20px;">
                            <i class="fa-solid fa-check fa-xs"></i>
                        </button>
                        <p class="to-do mb-0">Finished Project</p>
                    </div>
                    <hr class="divider">
                </div>
            </div>
            
            <div class="align-items-center py-lg-2" id="addNewTaskContainer" onclick="addNewTask()">
                <div id="newTaskTextContainer" class="d-flex align-items-center gap-3">
                    <i class="fa-duotone fa-solid fa-plus"></i>
                    <p class="text-muted mb-0">Add task</p>
                </div>
                <hr class="divider">
            </div>

            <div class="add-new-task card mt-lg-2 mt-1" id="addNewTask" style="display: none;">
                <form class="d-flex flex-column p-3 gap-1" id="newTask">
                    <input type="text" name="title" id="addTitle" placeholder="Task name" class="p-2 rounded-1">
                    <div class="form-btn-container gap-3">
                        <!-- Added type="button" to prevent form auto-submission -->
                        <button type="button" onclick="cancelTask()" class="form-btn border bg-transparent p-2">
                            <i class="fa-solid fa-x" style="color: rgb(47, 47, 47);"></i>
                        </button>
                        <button type="submit" class="submit-arrow form-btn border bg-transparent p-2">
                            <i class="fa-solid fa-arrow-right" style="color: rgb(47, 47, 47);"></i>
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>
<script src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
